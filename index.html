<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Login Firebase</title>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:50px auto;padding:20px;background:#111;color:#eee}
button{background:#fff;color:#111;border:0;border-radius:10px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
#debug{margin-top:20px;background:#222;padding:15px;border-radius:8px;font-family:monospace;font-size:13px;line-height:1.8;max-height:400px;overflow-y:auto;border:1px solid #444}
.err{color:#ff6b5e}.ok{color:#3ed598}
</style>
</head>
<body>
<h1>🔐 Test đăng nhập Firebase</h1>
<button id="btnLogin">Đăng nhập bằng Google</button>
<div id="debug"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';

const dbgBox = document.getElementById('debug');
function log(msg, type) {
  const div = document.createElement('div');
  if (type === 'err') div.className = 'err';
  else if (type === 'ok') div.className = 'ok';
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  dbgBox.appendChild(div);
  console.log(msg);
}

log('Bắt đầu khởi động...');

const firebaseConfig = {
  apiKey: "AIzaSyC2YAeztU-lExlV2Xd6yT4sH5YEQ93hbNs",
  authDomain: "hl3017.firebaseapp.com",
  projectId: "hl3017",
  storageBucket: "hl3017.firebasestorage.app",
  messagingSenderId: "396522230028",
  appId: "1:396522230028:web:9783880231fa1c77def929"
};

try {
  log('Đang khởi tạo Firebase app...');
  const app = initializeApp(firebaseConfig);
  log('✓ Firebase app OK', 'ok');
  
  log('Đang khởi tạo Auth...');
  const auth = getAuth(app);
  log('✓ Auth OK', 'ok');
  
  log('Domain hiện tại: ' + location.hostname);
  log('Đang gắn handler cho nút...', 'ok');
  
  document.getElementById('btnLogin').addEventListener('click', async () => {
    log('→ Bạn vừa BẤM NÚT!');
    try {
      log('Đang mở popup Google...');
      const provider = new GoogleAuthProvider();
      const result = await signInWithPopup(auth, provider);
      log('✓ ĐĂNG NHẬP THÀNH CÔNG: ' + result.user.email, 'ok');
      log('UID: ' + result.user.uid, 'ok');
    } catch (err) {
      log('✗ LỖI: ' + err.code, 'err');
      log('Message: ' + err.message, 'err');
      if (err.code === 'auth/unauthorized-domain') {
        log('→ CẦN THÊM "' + location.hostname + '" vào Firebase Console → Authentication → Settings → Authorized domains', 'err');
      }
    }
  });
  
  log('✓ Handler đã gắn xong — SẴN SÀNG', 'ok');
  
  onAuthStateChanged(auth, (user) => {
    if (user) log('User đang đăng nhập: ' + user.email, 'ok');
    else log('Chưa có user nào đăng nhập');
  });
  
} catch (e) {
  log('✗ LỖI KHỞI TẠO: ' + e.message, 'err');
  log('Stack: ' + e.stack, 'err');
}

log('=== Script đã chạy xong ===');
</script>
</body>
</html>
